site_name: "Pyqure"
site_author: "Mathieu LETRONE"
copyright: "Copyright &copy; 2025, Mathieu LETRONE"

theme:
  name: material
  locale: en
  favicon: assets/img/favicon-big.ico
  logo: assets/img/logo-transparent.png
  icon:
    repo: fontawesome/brands/github
  palette:
    primary: deep purple
    accent: orange
  features:
    - navigation.sections
    - navigation.top
    - navigation.tabs
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - content.code.annotate


repo_name: "mLetrone/pyqure"
repo_url: "https://github.com/mLetrone/pyqure"
extra:
  version:
    provider: mike

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

nav:
  - Get Started:
      - Overview: index.md
      - Installation: installation.md
  - Learn:
    - tutorial/index.md
    - tutorial/type_hints.md
    - tutorial/decorator.md
    - Registering: tutorial/dependencies/index.md
    - Injection: tutorial/dependencies/index.md
  - API Documentation:
      - Container: api/container.md
      - Injection: api/injection.md
      - Exceptions: api/exceptions.md

plugins:
  - mike:
      alias_type: symlink
      canonical_version: latest
  - search
  - termynal
  - mkdocstrings:
      handlers:
        python:
          paths: [ pyqure ]
          options:
            docstring_style: google
            members_order: source
            separate_signature: true
            show_source: false
            inherited_members: true
            filters: [ "!^_", "^__[^_]+__" ]
            docstring_options:
              ignore_init_summary: true
            merge_init_into_class: true
            show_signature_annotations: true
            signature_crossrefs: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences
  - toc:
      permalink: true
      title: Page contents
  - admonition
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.extra:
      pymdownx.superfences:
        custom_fences:
          - name: mermaid
            class: mermaid
            format: "!!python/name:pymdownx.superfences.fence_code_format"
  - pymdownx.emoji:
      emoji_index: "!!python/name:material.extensions.emoji.twemoji"
      emoji_generator: "!!python/name:material.extensions.emoji.to_svg"
  - pymdownx.tabbed:
      alternate_style: true
